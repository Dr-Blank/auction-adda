name: CI

# The image is published only after the prek checks (prek.toml) and a container smoke test pass.
# `check` and `image` run side by side; `publish` waits for both.
# main     -> :latest and :sha-<short>  (rolling release)
# v1.2.3   -> :1.2.3 and :1.2           (:latest stays on main)
# PR       -> builds and smoke-tests the image, pushes nothing

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main supersedes an older one; tag builds always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Only main and tags write caches; PRs read them, so they cannot evict main's.
  WRITE_CACHE: ${{ github.event_name != 'pull_request' }}

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.WRITE_CACHE }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A prebuilt binary; cargo-deny-action builds a container on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Every check lives in prek.toml, the same hooks that run on commit and push locally:
      # formatting, clippy, typecheck, tests (which also fail on a stale src/generated),
      # cargo-deny and the production build.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "0.5.11"
          extra-args: --all-files --hook-stage manual

  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Layer cache lives in GHCR as :buildcache. The package is public, so PRs read it without
      # logging in; only main and tags log in and write it.
      - name: Cache ref
        run: echo "CACHE=${IMAGE,,}:buildcache" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: env.WRITE_CACHE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms in one build, so they compile at the same time. The result stays in the
      # builder: the smoke test below and the publish job reuse it from cache.
      - name: Build every platform
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ env.WRITE_CACHE == 'true' && format('type=registry,ref={0},mode=max', env.CACHE) || '' }}

      - name: Load amd64 for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: auction-adda:smoke

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8787:8787 --read-only --cap-drop ALL auction-adda:smoke
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then
              curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">' && exit 0
              echo "index.html not served"; break
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

  publish:
    name: Publish image
    needs: [check, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Cache ref
        run: echo "CACHE=${IMAGE,,}:buildcache" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Put labels on the multi-arch index too, so GHCR shows the source, licence and description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Auction Adda
            org.opencontainers.image.description=Browser auction card game for 3-5 friends on voice chat

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the cache the image job just wrote; nothing recompiles.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.CACHE }}
