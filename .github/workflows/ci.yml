name: CI

# One pipeline: the image is published only after lints, tests and a container smoke test pass.
# main     -> :latest and :sha-<short>  (rolling release)
# v1.2.3   -> :1.2.3 and :1.2           (:latest stays on main)
# PR       -> builds and smoke-tests the image, pushes nothing

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main supersedes an older one; tag builds always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Also rewrites src/generated from the Rust types.
      - run: cargo test --locked --workspace
      - name: Generated TypeScript is up to date
        run: |
          git status --porcelain src/generated
          test -z "$(git status --porcelain src/generated)" || {
            echo "src/generated is stale: run cargo test and commit the result"; exit 1; }
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo build --locked -p server
      - run: npm ci
      - run: npm run typecheck
      # The socket tests, against the binary built above.
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Put labels on the multi-arch index too, so GHCR shows the source, licence and description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Auction Adda
            org.opencontainers.image.description=Browser auction card game for 3-5 friends on voice chat

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: auction-adda:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8787:8787 --read-only --cap-drop ALL auction-adda:smoke
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then
              curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">' && exit 0
              echo "index.html not served"; break
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
