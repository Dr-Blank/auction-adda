# Git hooks and CI checks, defined once. https://prek.j178.dev
#
#   prek install                       once per clone: commit, push and commit-msg hooks
#   prek run                           the commit checks on staged files
#   prek run --all-files --hook-stage manual
#                                      everything, as CI runs it (needs cargo-deny)
#
# commit:     fast fixers and formatters on the staged files
# push:       clippy, typecheck, Rust and socket tests
# manual/CI:  all of the above plus cargo-deny and the production build

minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit", "manual"]
# Written by `cargo test` (ts-rs) / blessed engine output: never hand-edited.
exclude = '^(src/generated|crates/engine/fixtures)/'

[priorities]
read-only = 0
# Hooks sharing a priority run in parallel, so each file-writing fixer gets its own.
fix-text = 10
fix-eol = 15
fix-eof = 20
format = 30
lint = 100
test = 110
socket-test = 120
release = 130

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict", priority = "read-only" },
  { id = "check-added-large-files", priority = "read-only" },
  { id = "check-case-conflict", priority = "read-only" },
  { id = "detect-private-key", priority = "read-only" },
  { id = "check-toml", priority = "read-only" },
  { id = "check-yaml", priority = "read-only" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], priority = "fix-text" },
  { id = "mixed-line-ending", args = ["--fix=lf"], priority = "fix-eol" },
  { id = "end-of-file-fixer", priority = "fix-eof" },
  # No AI attribution in commit messages.
  { id = "check-commit-trailers", args = ["--deny", "Co-authored-by=(?i)(claude|anthropic)"], stages = ["commit-msg"] },
  { id = "deny-pattern", name = "no AI attribution in message", args = ["-i", "generated (with|by) .*claude"], stages = ["commit-msg"] },
]

[[repos]]
repo = "local"
hooks = [
  # ---- commit ----
  { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "cargo fmt --all", types = ["rust"], pass_filenames = false, priority = "format" },
  { id = "biome", name = "biome check", language = "system", entry = "node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true", files = '\.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|md)$', priority = "format" },

  # ---- push ----
  { id = "clippy", name = "cargo clippy", language = "system", entry = "cargo clippy --locked --workspace --all-targets -- -D warnings", pass_filenames = false, always_run = true, stages = ["pre-push", "manual"], priority = "lint" },
  { id = "tsc", name = "tsc", language = "system", entry = "npm run -s typecheck", pass_filenames = false, always_run = true, stages = ["pre-push", "manual"], priority = "lint" },
  # Also rewrites src/generated: the hook fails if that changed, so stale TS types never land.
  { id = "cargo-test", name = "cargo test", language = "system", entry = "cargo test --locked --workspace", pass_filenames = false, always_run = true, stages = ["pre-push", "manual"], priority = "test" },
  { id = "npm-test", name = "socket tests", language = "system", entry = "npm test", pass_filenames = false, always_run = true, stages = ["pre-push", "manual"], priority = "socket-test" },

  # ---- CI ----
  { id = "cargo-deny", name = "cargo deny", language = "system", entry = "cargo deny --all-features --locked check", pass_filenames = false, always_run = true, stages = ["manual"], priority = "release" },
  { id = "vite-build", name = "vite build", language = "system", entry = "npm run -s build", pass_filenames = false, always_run = true, stages = ["manual"], priority = "release" },
]
