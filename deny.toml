# cargo deny check: security advisories, yanked crates, licences and sources of the dependencies.

[advisories]
yanked = "deny"

[licenses]
# Every licence a dependency uses (alone or as a required part); all are compatible with AGPL-3.0.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates (AGPL-3.0-only, not published).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
