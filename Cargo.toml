[workspace]
resolver = "3"
members = ["crates/game", "crates/engine", "crates/pahunch", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/Dr-Blank/auction-adda"
publish = false

[workspace.dependencies]
game = { path = "crates/game" }
engine = { path = "crates/engine" }
pahunch = { path = "crates/pahunch" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1"
# Bundled time zone data: the Alpine image has no /usr/share/zoneinfo.
jiff = { version = "1.0.1", features = ["tzdb-bundle-always"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
# Not panic = "abort": the server catches a panic in a message handler and keeps running.
